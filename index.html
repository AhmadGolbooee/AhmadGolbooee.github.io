<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>

      <a href="#contact" data-i18n="nav.contact">Contact</a>

      <button id="langToggle" class="btn-icon" type="button" aria-label="Switch language">

    </div>

        <p class="eyebrow"><span class="dot"></span><span data-i18n="hero.available"></span></p>
        <h1 data-i18n="hero.name">Ahmad Golbooee</h1>

        <p class="hero-loc" data-i18n="hero.location"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#contact" data-i18n="hero.ctaContact"></a>

      </div>
      <div class="hero-card">
        <img src="https://avatars.githubusercontent.com/u/337410342?v=4" alt="Ahmad Golbooee" width="150" height="150" />
        <dl class="mini-facts">
          <div><dt data-i18n="facts.role"></dt><dd data-i18n="facts.roleVal"></dd></div>
          <div><dt data-i18n="facts.focus"></dt><dd data-i18n="facts.focusVal"></dd></div>
          <div><dt data-i18n="facts.base"></dt><dd data-i18n="facts.baseVal"></dd></div>

    <section id="about" class="wrap section">
      <h2 class="section-title"><span class="hash">#</span><span data-i18n="about.title"></span></h2>
      <p class="lead" data-i18n="about.body"></p>
      <p class="lead" data-i18n="about.body2"></p>
    </section>

    <section id="stack" class="wrap section">
      <h2 class="section-title"><span class="hash">#</span><span data-i18n="stack.title"></span></h2>
      <div class="grid-3" id="stackGrid"></div>
    </section>

    <section id="projects" class="wrap section">
      <h2 class="section-title"><span class="hash">#</span><span data-i18n="projects.title"></span></h2>
      <div class="grid-2" id="projectsGrid"></div>
    </section>

    <section id="now" class="wrap section">
      <h2 class="section-title"><span class="hash">#</span><span data-i18n="now.title"></span></h2>
      <div class="grid-3" id="nowGrid"></div>
    </section>

    <section id="contact" class="wrap section">
      <h2 class="section-title"><span class="hash">#</span><span data-i18n="contact.title"></span></h2>
      <p class="lead" data-i18n="contact.body"></p>

  <footer class="wrap">
    <p><span id="footYear"></span> · <span data-i18n="foot.built"></span></p>
