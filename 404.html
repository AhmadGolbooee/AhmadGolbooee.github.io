<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found | Ahmad Golbooee</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span></div>

  <main class="wrap" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding-block:60px">
    <div>
      <p style="font-family:'JetBrains Mono',monospace;font-size:clamp(72px,18vw,150px);line-height:1;margin:0;
                background:linear-gradient(120deg,var(--text),var(--accent) 55%,var(--accent-2));
                -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">404</p>
      <h1 style="font-size:22px;margin:14px 0 8px" data-en="Page not found" data-fa="صفحه پیدا نشد">Page not found</h1>
      <p style="color:var(--muted);margin:0 0 26px" data-en="This URL does not exist — but the résumé does." data-fa="این نشانی وجود ندارد — اما رزومه هست.">
        This URL does not exist — but the résumé does.
      </p>
      <div style="display:flex;gap:11px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-primary" href="/" data-en="Back to home" data-fa="بازگشت به خانه">Back to home</a>
        <a class="btn btn-ghost" href="https://github.com/AhmadGolbooee" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("ag:theme"); } catch (e) {}
      if (saved) document.documentElement.dataset.theme = saved;
      else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
        document.documentElement.dataset.theme = "light";
      }
      var lang = "en";
      try { lang = localStorage.getItem("ag:lang") === "fa" ? "fa" : "en"; } catch (e) {}
      var fa = lang === "fa";
      document.documentElement.lang = fa ? "fa" : "en";
      document.documentElement.dir = fa ? "rtl" : "ltr";
      document.querySelectorAll("[data-en]").forEach(function (el) {
        el.textContent = el.getAttribute(fa ? "data-fa" : "data-en");
      });
    })();
  </script>
</body>
</html>
